# Publie la version statique (chrono hors ligne) sur GitHub Pages.
# GitHub Pages ne sert que des fichiers : la synchronisation multi-appareils,
# les QR codes et les questions du public demandent le serveur Node, qui doit
# etre heberge ailleurs (voir la section Deploiement du README).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-static.mjs dist
        env:
          # Facultatif : definir la variable de depot TIMESTAGE_SERVER_URL pour
          # pointer vers l'instance complete depuis la page statique.
          TIMESTAGE_SERVER_URL: ${{ vars.TIMESTAGE_SERVER_URL }}
          TIMESTAGE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
