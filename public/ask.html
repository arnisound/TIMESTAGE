<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questions et sondages | TimeStage</title>
<meta name="description" content="Votez au sondage en cours et envoyez votre question a la regie, qui la relit avant affichage.">
<meta name="author" content="Arnisound Tools (Theo Arnissolle)">
<meta name="copyright" content="© 2026 Arnisound Tools. Tous droits reserves.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png?v=3" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/css/base.css">
<style>
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: 1rem; }
  .live { display: flex; align-items: baseline; gap: .5rem; justify-content: center; padding: .6rem; }
  .live .value { font-family: var(--mono); font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .live .value[data-phase="final"], .live .value[data-phase="overrun"] { color: var(--danger); }
  .live .value[data-phase="wrapup"] { color: var(--warn); }
  .mine li { font-size: .88rem; }
  .poll-q { font-size: 1.05rem; font-weight: 600; margin: 0 0 .6rem; }
  .poll-choices { display: grid; gap: .4rem; }
  .poll-choice {
    position: relative;
    display: flex;
    align-items: center;
    gap: .6rem;
    overflow: hidden;
    width: 100%;
    padding: .7rem .8rem;
    text-align: left;
    font-size: .95rem;
  }
  .poll-choice .bar {
    position: absolute;
    inset: 0 auto 0 0;
    background: rgba(203, 138, 39, .28);
    transition: width .4s ease;
  }
  .poll-choice > span:not(.bar) { position: relative; }
  .poll-choice .key { flex: none; width: 1.3rem; color: var(--accent); font-family: var(--mono); font-weight: 700; }
  .poll-choice .label { flex: 1 1 auto; min-width: 0; word-break: break-word; }
  .poll-choice .share { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .poll-choice[aria-pressed="true"] {
    background: var(--panel-2);
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .poll-choice .mark { flex: none; color: var(--accent); font-weight: 700; }
  .poll-choice:disabled { opacity: .75; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="row tight"><img src="/icons/logo.png" alt="" width="22" height="22"><strong id="room-name">TimeStage</strong></span>
    <span class="code-badge" id="room-code">-----</span>
  </header>

  <section class="panel hidden" id="access-panel">
    <div class="panel-head"><h2 class="panel-title">Salle protegee</h2></div>
    <form id="access-form" class="stack">
      <div class="field">
        <label for="access">Code d'acces</label>
        <input id="access" type="text" maxlength="32" autocomplete="off" placeholder="Affiche en salle" required>
      </div>
      <button class="btn primary block" type="submit">Entrer</button>
    </form>
  </section>

  <section class="panel" id="live-panel">
    <div class="panel-head"><h2 class="panel-title" id="live-title">En cours</h2><span class="chip" id="status">…</span></div>
    <div class="live"><span class="value mono" id="live-value">--:--</span></div>
  </section>

  <section class="panel hidden" id="poll-panel" style="margin-top:.8rem">
    <div class="panel-head"><h2 class="panel-title">Sondage</h2><span class="chip" id="poll-state">Ouvert</span></div>
    <p class="poll-q" id="poll-question"></p>
    <div class="poll-choices" id="poll-choices"></div>
    <p class="muted" style="margin:.6rem 0 0"><small id="poll-foot"></small></p>
  </section>

  <section class="panel" id="question-panel" style="margin-top:.8rem">
    <div class="panel-head"><h2 class="panel-title">Votre question</h2></div>
    <form id="ask-form" class="stack">
      <div class="field">
        <label for="text">Question</label>
        <textarea id="text" maxlength="500" required placeholder="Ecrivez votre question…" rows="4"></textarea>
        <small class="muted" id="counter">0 / 500</small>
      </div>
      <div class="field">
        <label for="author">Votre prenom (optionnel)</label>
        <input type="text" id="author" maxlength="60" autocomplete="given-name" placeholder="Anonyme">
      </div>
      <button class="btn primary block lg" type="submit" id="send">Envoyer a la regie</button>
      <p class="muted" style="margin:0"><small>Votre question est relue par la regie avant toute projection a l'ecran.</small></p>
    </form>
    <div class="empty hidden" id="closed">Les questions sont fermees pour le moment.</div>
  </section>

  <section class="panel hidden" id="mine-panel" style="margin-top:.8rem">
    <div class="panel-head"><h2 class="panel-title">Vos envois</h2></div>
    <ul class="list mine" id="mine"></ul>
  </section>

  <footer class="center muted" style="margin-top:1.5rem">
    <small>
      <a href="/">TimeStage</a> · © 2026 Arnisound Tools · <a href="/legal">Mentions legales</a>
    </small>
  </footer>
</div>
<script type="module" src="/js/ask.js"></script>
</body>
</html>
